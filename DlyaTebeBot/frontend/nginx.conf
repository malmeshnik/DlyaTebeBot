server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MiniApp root
    location /miniapp/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Assets (js/css)
    location /miniapp/assets/ {
        alias /usr/share/nginx/html/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
