{% extends "admin/change_list.html" %}
{% load i18n %}

{% block content_title %}
    <div style="display: flex; align-items: center; gap: 1rem;">
        <h1>{{ title }}</h1>
        {% if total_unread %}
            <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 10px; background: rgb(115, 96, 242); color: white; border-radius: 14px; font-weight: 600; font-size: 0.875rem;">
                {{ total_unread }}
            </span>
        {% endif %}
    </div>
{% endblock %}
