version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: >
      sh -c "python manage.py migrate &&
            gunicorn --workers 3 --bind 0.0.0.0:8000 --timeout 60 DlyaTebeBot.wsgi:application"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    image: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /root/certbot-www:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - miniapp-frontend
    restart: unless-stopped

  schedulers:
    build: .
    command: python manage.py scheduler
    volumes:
      - media_volume:/app/media
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  bot:
    build: .
    command: python manage.py startbot
    volumes:
      - .:/app
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  viber_bot:
    build: .
    command: python manage.py set_viber_webhook
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  miniapp-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: dlyatebebot-miniapp-frontend:latest
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume: