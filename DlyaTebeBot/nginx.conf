worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ===== UPSTREAMS =====
    upstream django_app {
        server web:8000;
    }

    upstream miniapp_frontend {
        server miniapp-frontend:80;
    }

    # ===== HTTP → HTTPS =====
    server {
        listen 80;
        server_name dlyatebebot.com www.dlyatebebot.com;

        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/.well-known/acme-challenge/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===== HTTPS =====
    server {
        listen 443 ssl http2;
        server_name dlyatebebot.com www.dlyatebebot.com;

        ssl_certificate /etc/letsencrypt/live/dlyatebebot.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dlyatebebot.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # ===== STATIC / MEDIA =====
        location /static/ {
            alias /app/staticfiles/;
            access_log off;
            expires 30d;
        }

        location /media/ {
            alias /app/media/;
            access_log off;
            expires 30d;
        }

        # ===== MINIAPP (REACT + VITE BUILD) =====
        location /miniapp/ {
            proxy_pass http://miniapp_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ===== DJANGO =====
        location / {
            proxy_pass http://django_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
